[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-security-sentinel"
version = "1.3.0"
description = "Production-grade OWASP API Security auditor, vulnerability scanner, and DevSecOps analyzer"
readme = "README.md"
authors = [{ name = "Rupraj Datta", email = "dattarupraj@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
sentinel = "backend_security_sentinel.cli:main"
